            <path d="M632 421l9-5 8 7-2 13-10 7-8-8Z" />

          <text class="place-label__country" x="450" y="700" text-anchor="end">AUSTRALIA</text>
          <text class="place-label__city" x="450" y="731" text-anchor="end">SYDNEY</text>
          <text class="place-label__traveller" x="450" y="762" text-anchor="end">KYO SON</text>

      </svg>
      <div class="flight flight--aura"><div class="flight__float"><img src="assets/characters/aura-flying.png" alt="Aura flying from Manila toward Kyo Son"></div></div>
      <div class="flight flight--kyo"><div class="flight__float"><img src="assets/characters/kyo-flying.png" alt="Kyo Son flying from Sydney toward Aura"></div></div>
      <div class="meeting-scene">
        <img src="assets/characters/meeting.png" alt="Kyo Son and Aura meeting for the first time">
        <span class="heart" aria-hidden="true"></span>
      </div>
      <div class="wedding-scene">
        <div class="cross" aria-hidden="true"><span></span></div>
        <img src="assets/characters/wedding-couple.png" alt="Kyo Son and Aura together in their wedding attire">
      </div>
      <div class="opening__copy">
        <p class="eyebrow">Together with their families</p>
        <h1 id="couple-title">KYO SON <span>&amp;</span> AURA</h1>
        <p class="tagline">Two cultures. Two families. One faith.</p>
        <p class="date"><time datetime="2027-01-09">09 <i></i> 01 <i></i> 2027</time></p>
      </div>
      <button class="open-button" type="button" aria-controls="invitation-content">
        <span>Open Invitation</span>
        <span class="open-button__arrow" aria-hidden="true">&#8595;</span>
      </button>
    </section>
    <section class="invitation" id="invitation-content" tabindex="-1" aria-labelledby="invitation-title">
      <div class="invitation__inner">
        <span class="invitation__cross" aria-hidden="true"></span>
        <p class="invitation__kicker">TOGETHER WITH OUR FAMILIES</p>

        <header class="invitation__header">
          <h2 class="invitation__names" id="invitation-title">
            <span class="invitation__name">KYO SON</span>
            <span class="invitation__ampersand">&amp;</span>
            <span class="invitation__name">AURA</span>
          </h2>
          <p class="invitation__wording">joyfully invite you to celebrate their wedding</p>
        </header>

        <div class="invitation__divider" aria-hidden="true"><span></span></div>

        <section class="event-details" aria-label="Wedding ceremony details">
          <time class="event-date" datetime="2027-01-09">
            <span class="event-date__date">09 JANUARY 2027</span>
            <span class="event-date__day">SATURDAY</span>
          </time>

          <p class="event-details__ceremony">
            <span>Ceremony</span>
            <strong>[TIME PLACEHOLDER]</strong>
          </p>

          <address class="event-venue">
            <strong>[VENUE NAME]</strong>
            <span>Bataan, Philippines</span>
          </address>

          <a class="location-link" href="https://www.google.com/maps/search/?api=1&amp;query=Bataan%2C%20Philippines" target="_blank" rel="noopener noreferrer" aria-label="View Bataan, Philippines on Google Maps (opens in a new tab)">
            View Location
          </a>
        </section>

        <figure class="scripture">
          <blockquote>
            <p>Therefore what God has joined together, let no one separate.</p>
          </blockquote>
          <figcaption>Mark 10:9</figcaption>
        </figure>
      </div>
    </section>
  </main>
  <script src="js/animation.js" defer></script>
</body>
</html>
